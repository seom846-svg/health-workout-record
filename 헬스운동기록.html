
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>헬스 운동 기록 프로그램</title>


<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    padding: 30px;
    color: #263b58;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

h1 {
    text-align: center;
    color: #244b7a;
    font-size: 28px;
}

h3 {
    color: #315b91;
    margin-top: 25px;
}

input {
    box-sizing: border-box;
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #dce4ef;
    border-radius: 9px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #4385c5;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    background: #356da8;
    color: white;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    background: #244b7a;
}

.delete {
    background: #e16b6b;
}

.delete:hover {
    background: #c94c4c;
}

.result {
    background: #f5f8fc;
    padding: 16px;
    margin-top: 12px;
    border: 1px solid #e4ebf4;
    border-radius: 12px;
    line-height: 1.8;
}

#total {
    background: #eaf2fc;
    color: #244b7a;
    padding: 17px;
    border-radius: 12px;
    text-align: center;
}
</style>

</head>

<body>

<div class="container">

<h1>💪 헬스 운동 기록</h1>
<p>오늘의 운동을 기록하고 관리해 보세요!</p>

<h3>운동 기록 입력</h3>

<input id="name" type="text" placeholder="운동 이름">
<input id="sets" type="number" placeholder="세트 수">
<input id="reps" type="number" placeholder="세트당 반복 횟수">

<button onclick="addWorkout()">운동 기록 추가</button>

<h3>나의 운동 기록</h3>

<div id="records"></div>

<h3 id="total">전체 반복 횟수: 0회</h3>

</div>

<script>

let workoutList = [];

// 운동 기록 추가 함수
function addWorkout() {

    let name = document.getElementById("name").value;
    let sets = Number(document.getElementById("sets").value);
    let reps = Number(document.getElementById("reps").value);

    if (name === "" || sets <= 0 || reps <= 0 ||
        !Number.isInteger(sets) || !Number.isInteger(reps)) {
        alert("운동 이름과 올바른 세트 수, 반복 횟수를 입력하세요.");
        return;
    }

    workoutList.push({
        name: name,
        sets: sets,
        reps: reps
    });

    document.getElementById("name").value = "";
    document.getElementById("sets").value = "";
    document.getElementById("reps").value = "";

    showWorkout();
}

// 운동 기록 확인 함수
function showWorkout() {

    let result = document.getElementById("records");
    result.innerHTML = "";

    let total = 0;

    workoutList.forEach(function(workout, index) {

        let count = workout.sets * workout.reps;
        total += count;

        result.innerHTML += `
            <div class="result">
                <b>${workout.name}</b><br>
                세트 수: ${workout.sets}<br>
                총 반복 횟수: ${count}회<br>
                <button class="delete"
                onclick="deleteWorkout(${index})">
                삭제
                </button>
            </div>
        `;
    });

    document.getElementById("total").innerText =
        "전체 반복 횟수: " + total + "회";
}

// 운동 기록 삭제 함수
function deleteWorkout(index) {

    workoutList.splice(index, 1);
    showWorkout();

}

</script>

</body>
</html>
